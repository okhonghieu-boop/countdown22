<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:white;
  overflow:hidden;
  font-family:"Times New Roman", Times, serif;
  font-size:13px;
}

.marquee-box{
  width:100%;
  height:26px;
  overflow:hidden;
  position:relative;
}

.marquee{
  position:absolute;
  top:2px;
  white-space:nowrap;
  animation: run 35s linear infinite;
}

@keyframes run{
  from{ transform:translateX(100%); }
  to{ transform:translateX(-100%); }
}
</style>
</head>

<body>

<div class="marquee-box">
  <div class="marquee">
    MINIGAME NÀY ĐƯỢC TÀI TRỢ BỞI HIEUGROUP |
    <iframe
      src="https://weatherwidget.io/w/?cities=BacNinh,Hanoi,TuyenQuang,ThanhHoa,QuangNinh,QuangTri,NgheAn,DaNang,LamDong,KhanhHoa,CanTho,HoChiMinh,CaMau&unit=metric&theme=plain&transparent=true"
      style="border:none;width:1300px;height:24px;vertical-align:middle;"
      loading="lazy">
    </iframe>
  </div>
</div>

</body>
</html>
